<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corrupt • Link Shortener Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing: border-box; font-family: 'Share Tech Mono', monospace; }
body {
  height: 100vh;
  background: url('https://i.pinimg.com/originals/25/d6/ae/25d6aeafcf3ab62953af0aa675e1f9ec.gif') no-repeat center center/cover fixed;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: white;
}
h1 { font-size: 4rem; animation: glitch 1s infinite; }
@keyframes glitch {
  0% { text-shadow: 2px 0 red; }
  20% { text-shadow: -2px -2px #fff; }
  40% { text-shadow: 2px 2px red; }
  60% { text-shadow: -2px 0 #fff; }
  80% { text-shadow: 0 2px red; }
  100% { text-shadow: 0 0 #fff; }
}
.shortener-buttons {
  display: flex;
  gap: 15px;
  margin-top: 50px;
  flex-wrap: wrap;
  justify-content: center;
}
.shortener-btn {
  padding: 12px 25px;
  border: 2px solid #fff;
  border-radius: 10px;
  background: rgba(255,255,255,0);
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  animation: glitchBtn 2s infinite;
  font-size: 1.2rem;
}
@keyframes glitchBtn {
  0% { text-shadow: 2px 0 red; }
  25% { text-shadow: -2px 2px #fff; }
  50% { text-shadow: 2px -2px red; }
  75% { text-shadow: -2px -2px #fff; }
  100% { text-shadow: 0 0 #fff; }
}
</style>
</head>
<body>
<h1>Corrupt</h1>
<div class="shortener-buttons">
  <button class="shortener-btn" onclick="openShortener('isgd')">Is.gd</button>
  <button class="shortener-btn" onclick="openShortener('tinyurl')">TinyURL</button>
  <button class="shortener-btn" onclick="openShortener('dagd')">Da.gd</button>
</div>

<script>
function openShortener(service) {
  window.location.href = `shortener.html?service=${service}`;
}
</script>
</body>
</html>
