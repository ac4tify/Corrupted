<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corrupt • Link Shortener Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing: border-box; font-family: 'Share Tech Mono', monospace; }
body {
  min-height: 100vh;
  background: url('https://i.pinimg.com/originals/25/d6/ae/25d6aeafcf3ab62953af0aa675e1f9ec.gif') no-repeat center center/cover fixed;
  display: flex;
  flex-direction: column;
  align-items: center;
  color: white;
  text-align: center;
}
h1 { font-size: 4rem; margin-top: 40px; animation: glitch 1s infinite; }
@keyframes glitch {
  0% { text-shadow: 2px 0 red; } 
  20% { text-shadow: -2px -2px #fff; }
  40% { text-shadow: 2px 2px red; }
  60% { text-shadow: -2px 0 #fff; }
  80% { text-shadow: 0 2px red; }
  100% { text-shadow: 0 0 #fff; }
}
.shortener-buttons { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; align-items: center; }
.shortener-btn {
  padding: 15px 30px; border: 2px solid #fff; border-radius: 10px;
  background: rgba(255,255,255,0); color: #fff; font-weight: bold;
  cursor: pointer; font-size: 1.3rem; width: 250px;
  transition: 0.2s;
}
.shortener-btn:hover { transform: scale(1.05); }
.recommended { color: red; font-size: 0.9rem; display:block; margin-top:5px; }
.container { display:none; background: rgba(0,0,0,0.3); border: 2px solid #fff; border-radius: 15px; padding: 30px; width: 320px; margin-bottom: 20px; }
input, select, button { width:100%; padding:10px 15px; border:2px solid #fff; border-radius:10px; background: rgba(255,255,255,0.2); color:#fff; font-size:1rem; text-align:center; margin-bottom:10px; }
button { cursor:pointer; font-size:1.2rem; }
#result { margin-top:10px; font-size:1rem; color:#fff; word-wrap:break-word; text-align:center; border:2px solid #fff; border-radius:10px; background:rgba(255,255,255,0.1); padding:10px; }
.discord-btn { margin-top:20px; padding:12px 25px; border:2px solid #fff; border-radius:10px; background:rgba(255,255,255,0.2); color:#fff; font-size:1.2rem; text-decoration:none; }
.banner { margin-top:20px; }
</style>
</head>
<body>

<h1>Corrupt</h1>
<div class="shortener-buttons">
  <div>
    <button class="shortener-btn" onclick="showContainer('clickru')">click.ru</button>
    <span class="recommended">recommended</span>
  </div>
  <div>
    <button class="shortener-btn" onclick="showContainer('isgd')">is.gd</button>
  </div>
  <div>
    <button class="shortener-btn" onclick="showContainer('tinyurl')">TinyURL</button>
  </div>
</div>

<div id="clickru" class="container">
  <input type="text" placeholder="Paste your link here" class="userLink">
  <select class="linkType">
    <option value="profile">Profile</option>
    <option value="group">Group</option>
    <option value="private">Private Server</option>
  </select>
  <button class="generateBtn">Generate</button>
  <div class="result">Your shortened link will appear here</div>
</div>

<div id="isgd" class="container">
  <input type="text" placeholder="Paste your link here" class="userLink">
  <select class="linkType">
    <option value="profile">Profile</option>
    <option value="group">Group</option>
    <option value="private">Private Server</option>
  </select>
  <button class="generateBtn">Generate</button>
  <div class="result">Your shortened link will appear here</div>
</div>

<div id="tinyurl" class="container">
  <input type="text" placeholder="Paste your link here" class="userLink">
  <select class="linkType">
    <option value="profile">Profile</option>
    <option value="group">Group</option>
    <option value="private">Private Server</option>
  </select>
  <button class="generateBtn">Generate</button>
  <div class="result">Your shortened link will appear here</div>
</div>

<a class="discord-btn" href="https://discord.gg/JeXsAxY6e" target="_blank">Join Our Discord Server</a>
<img class="banner" src="https://i.imgur.com/8RCzmp3.gif" alt="Banner">

<script src="shortener.js"></script>
</body>
</html>
