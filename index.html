<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corrupt • Shortener Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Share Tech Mono', monospace; }
body {
  min-height:100vh;
  background:url('https://i.pinimg.com/originals/25/d6/ae/25d6aeafcf3ab62953af0aa675e1f9ec.gif') no-repeat center center/cover fixed;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:#fff; text-align:center;
}
h1 { font-size:4rem; animation:glitch 1s infinite; }
@keyframes glitch {
  0%{text-shadow:2px 0 red}25%{text-shadow:-2px -2px #fff}
  50%{text-shadow:2px 2px red}75%{text-shadow:-2px 0 #fff}100%{text-shadow:0 2px red}
}
.description { margin:10px 0 40px 0; font-size:1rem; }

.shortener-buttons {
  display:flex; flex-direction:column; gap:15px;
  align-items:center;
}
.shortener-btn {
  width:250px; padding:15px 25px;
  border:2px solid #fff; border-radius:10px;
  background:rgba(255,255,255,0.1);
  color:#fff; font-size:1.3rem; cursor:pointer;
  animation:glitchBtn 2s infinite;
  transition:transform 0.2s;
}
.shortener-btn:hover { transform:scale(1.05); }
@keyframes glitchBtn {
  0%{text-shadow:2px 0 red}
  25%{text-shadow:-2px 2px #fff}
  50%{text-shadow:2px -2px red}
  75%{text-shadow:-2px -2px #fff}
  100%{text-shadow:0 0 #fff}
}
.recommended { color:red; font-size:0.8rem; display:block; margin-top:5px; }

.discord-btn {
  margin-top:30px; padding:12px 25px; border:2px solid #fff; border-radius:10px;
  background:rgba(255,255,255,0.2); color:#fff; font-size:1.2rem; text-decoration:none;
  animation:glitchBtn 2s infinite;
}
.banner { margin-top:25px; width:250px; }
</style>
</head>
<body>

<h1>Corrupt</h1>
<div class="description">Select your preferred shortener</div>

<div class="shortener-buttons">
  <button class="shortener-btn" onclick="openShortener('clckru')">Click.ru<span class="recommended">Recommanded</span></button>
  <button class="shortener-btn" onclick="openShortener('isgd')">is.gd</button>
  <button class="shortener-btn" onclick="openShortener('tinyurl')">TinyURL</button>
  <button class="shortener-btn" onclick="openShortener('vgd')">v.gd</button>
  <button class="shortener-btn" onclick="openShortener('dagd')">da.gd</button>
  <button class="shortener-btn" onclick="openShortener('shrtco')">shrtco.de</button>
</div>

<a class="discord-btn" href="https://discord.gg/JeXsAxY6e" target="_blank">Join Discord</a>
<img class="banner" src="https://i.imgur.com/8RCzmp3.gif" alt="banner">

<script>
function openShortener(service) {
  window.location.href = `shortener.html?service=${service}`;
}
</script>
</body>
</html>
