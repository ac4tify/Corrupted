<!DOCTYPE html>
<html lang="en">
<head>

<title>CorruptedV1 • Shortener</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
* {margin:0;padding:0;box-sizing:border-box;font-family:'Share Tech Mono', monospace;}
body {
  min-height:100vh;background:url('https://i.pinimg.com/originals/25/d6/ae/25d6aeafcf3ab62953af0aa675e1f9ec.gif') no-repeat center center/cover fixed;
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;text-align:center;

h1 {font-size:3rem;margin-bottom:20px;animation:glitch 1s infinite;}
@keyframes glitch {0%{text-shadow:2px 0 red}25%{text-shadow:-2px 2px #fff}50%{text-shadow:2px -2px red}75%{text-shadow:-2px -2px #fff}100%{text-shadow:0 0 #fff}}

  padding:25px;display:flex;flex-direction:column;align-items:center;gap:15px;width:320px;
}
input,select,button {
  width:100%;padding:10px 15px;border:2px solid #fff;border-radius:10px;
  background:rgba(255,255,255,0.2);color:#fff;font-size:1rem;text-align:center;
}
button {font-size:1.2rem;cursor:pointer;animation:glitchBtn 2s infinite;}
@keyframes glitchBtn {0%{text-shadow:2px 0 red}25%{text-shadow:-2px 2px #fff}50%{text-shadow:2px -2px red}75%{text-shadow:-2px -2px #fff}100%{text-shadow:0 0 #fff}}
#result {
  margin-top:10px;font-size:1rem;color:#fff;word-wrap:break-word;text-align:center;
  border:2px solid #fff;border-radius:10px;background:rgba(255,255,255,0.1);padding:10px;
}
.discord-btn {margin-top:15px;padding:12px 25px;border:2px solid #fff;border-radius:10px;
background:rgba(255,255,255,0.2);color:#fff;font-size:1.2rem;text-decoration:none;animation:glitchBtn 2s infinite;}
.banner {margin-top:20px;width:250px;border-radius:10px;}
</style>
</head>
<body>

<h1>CorruptedV1</h1>

<div class="container">
  <input type="text" id="userLink" placeholder="Paste your link here">
  <select id="linkType">
    <option value="profile">Profile</option>
    <option value="group">Group</option>
    <option value="private">Private Server</option>
  </select>
  <button id="generateBtn">Generate</button>
  <div id="result">Your shortened link will appear here</div>
</div>

<a class="discord-btn" href="https://discord.gg/JeXsAxY6e" target="_blank">Join Our Discord</a>
<img class="banner" src="https://i.imgur.com/8RCzmp3.gif" alt="banner">
